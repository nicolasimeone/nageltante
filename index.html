    <!-- Info-Panel rechts -->

      <div class="panel-top">

    </aside>

  </main>

  <script>
    // Zentrale Links – hier anpassen
    const BOOKING_URL = "#";    // z.B. https://xyz.hairlist.ch
    const INSTAGRAM_URL = "#";  // z.B. https://instagram.com/nageltante

    function setLink(selector, url) {
      document.querySelectorAll(selector).forEach(a => {
        a.href = url;
        if (url !== "#") { a.target = "_blank"; a.rel = "noopener"; }
      });
    }
    setLink("[data-booking]", BOOKING_URL);
    setLink("[data-instagram]", INSTAGRAM_URL);
    document.querySelectorAll("[data-year]").forEach(el => el.textContent = new Date().getFullYear());

    // Ladescreen: wartet auf Seite + Schrift, zeigt sich mind. 700 ms, höchstens 4 s
    (function () {
      const root = document.documentElement;
      const minTime = new Promise(r => setTimeout(r, 700));
      const loaded = new Promise(r => window.addEventListener("load", r, { once: true }));
      const fonts = document.fonts ? document.fonts.ready : Promise.resolve();
      const done = () => root.classList.remove("is-loading");
      Promise.all([minTime, loaded, fonts]).then(done);
      setTimeout(done, 4000);
    })();
  </script>
</body>
