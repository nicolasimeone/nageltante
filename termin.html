---
layout: seite
nummer: 3
daten: termin
---
{% assign a = site.data.allgemein %}{% assign d = site.data[page.daten] %}
    <section class="block">
      <h2 class="block-label">Online buchen</h2>
      <div class="block-body">
        <p class="lead">{{ d.gross | escape }}</p>
        <p><a href="#" class="btn" data-booking>{{ d.button | escape }} ↗</a></p>
      </div>
    </section>
    <section class="block">
      <h2 class="block-label">Gut zu wissen</h2>
      <div class="block-body">
        <ul class="list">{% for p in d.hinweise %}
          <li>{{ p | escape }}</li>{% endfor %}
        </ul>
      </div>
    </section>
