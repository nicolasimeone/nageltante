---
layout: seite
nummer: 1
daten: ueber_uns
---
{% assign a = site.data.allgemein %}{% assign d = site.data[page.daten] %}
    <section class="block">
      <h2 class="block-label">Geschichte</h2>
      <div class="block-body">
        <p class="lead">{{ d.geschichte_gross | escape }}</p>
        <p>{{ d.geschichte_text | escape | newline_to_br }}</p>
      </div>
    </section>
    <section class="block">
      <h2 class="block-label">Haltung</h2>
      <div class="block-body">
        <ul class="list">{% for p in d.haltung %}
          <li>{{ p | escape }}</li>{% endfor %}
        </ul>
      </div>
    </section>
