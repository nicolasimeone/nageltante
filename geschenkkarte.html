---
layout: seite
nummer: 7
daten: geschenkkarte
---
{% assign a = site.data.allgemein %}{% assign d = site.data[page.daten] %}
    <section class="block">
      <h2 class="block-label">Beträge</h2>
      <div class="block-body">
        <div class="chips">{% for b in d.betraege %}<span>{{ b | escape }}</span>{% endfor %}</div>
      </div>
    </section>
    <section class="block">
      <h2 class="block-label">So geht’s</h2>
      <div class="block-body">
        <ul class="list">{% for p in d.ablauf %}
          <li>{{ p | escape }}</li>{% endfor %}
        </ul>
        <p><a href="mailto:{{ a.email }}?subject=Geschenkkarte" class="btn">{{ d.button | escape }}</a></p>
      </div>
    </section>
