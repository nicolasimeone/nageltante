titel: Team
intro: Die Gesichter hinter Nageltante.
mitglieder:
  - name: Meli
    rolle: Nail Artist & Gründerin
    text: Nageltante ist aus Leidenschaft, Umwegen und Hingabe entstanden. Ich glaube an ehrliches Handwerk, Ästhetik ohne Kitsch und daran, dass Schönheit dann entsteht, wenn man sich Zeit nimmt und sich selbst sein kann.
    video: ""
    bild: ""
  - name: Nanji
    rolle: Nail Artist
    text: Mit viel Ruhe und einem Blick fürs Detail kreiere ich gepflegte und elegante Nägel, die deine Persönlichkeit unterstreichen. Bei mir darfst du abschalten und ganz du selbst sein.
    video: ""
    bild: ""
  - name: Yoshi
    rolle: Feel-Good Manager
    text: Ich heisse Yoshi. Ich mache keine Nägel, aber ohne mich wäre es hier nur halb so cool.
    video: ""
    bild: ""
